[tool.poetry]
    authors = ["Orbit Team <admin@orbit.is>"]
    description = ""
    license = "MIT"
    name = "orbitcloud_graviton"
    packages = [
        { include = "orbitcloud_graviton/acme_ssl", from = "bases" },
        { include = "orbitcloud_graviton/app_workload", from = "bases" },
        { include = "orbitcloud_graviton/app_zone", from = "bases" },
        { include = "orbitcloud_graviton/appservice_suite", from = "bases" },
        { include = "orbitcloud_graviton/az_acr", from = "components" },
        { include = "orbitcloud_graviton/az_ai", from = "components" },
        { include = "orbitcloud_graviton/az_app", from = "components" },
        { include = "orbitcloud_graviton/az_appconfig", from = "components" },
        { include = "orbitcloud_graviton/az_appservice", from = "components" },
        { include = "orbitcloud_graviton/az_backup", from = "components" },
        { include = "orbitcloud_graviton/az_compute", from = "components" },
        { include = "orbitcloud_graviton/az_eventgrid", from = "components" },
        { include = "orbitcloud_graviton/az_eventhub", from = "components" },
        { include = "orbitcloud_graviton/az_iam", from = "components" },
        { include = "orbitcloud_graviton/az_keyvault", from = "components" },
        { include = "orbitcloud_graviton/az_lib", from = "components" },
        { include = "orbitcloud_graviton/az_monitor", from = "components" },
        { include = "orbitcloud_graviton/az_network", from = "components" },
        { include = "orbitcloud_graviton/az_providerhub", from = "components" },
        { include = "orbitcloud_graviton/az_resources", from = "components" },
        { include = "orbitcloud_graviton/az_storage", from = "components" },
        { include = "orbitcloud_graviton/azure_environment", from = "bases" },
        { include = "orbitcloud_graviton/azure_tenant", from = "bases" },
        { include = "orbitcloud_graviton/cloud_init", from = "components" },
        { include = "orbitcloud_graviton/entra", from = "components" },
        { include = "orbitcloud_graviton/entra_external_id", from = "bases" },
        { include = "orbitcloud_graviton/hubspoke", from = "bases" },
        { include = "orbitcloud_graviton/landing_zone", from = "bases" },
        { include = "orbitcloud_graviton/oauth_apps", from = "bases" },
        { include = "orbitcloud_graviton/ora_queue", from = "components" },
        { include = "orbitcloud_graviton/oracledb", from = "bases" },
        { include = "orbitcloud_graviton/pulumi", from = "components" },
        { include = "orbitcloud_graviton/pulumi_jinja", from = "components" },
        { include = "orbitcloud_graviton/pulumi_jinja", from = "components" },
        { include = "orbitcloud_graviton/pulumi_lib", from = "components" },
        { include = "orbitcloud_graviton/pulumi_mocks", from = "components" },
        { include = "orbitcloud_graviton/workload_identities", from = "bases" },
    ]
    readme = "README.md"
    version = "0.70.0"

[tool.polylith]
    namespace = "orbitcloud_graviton"

    [tool.polylith.tag.patterns]
        release = "v[0-9]*"
        stable  = "stable-*"

[tool.polylith.structure]
    theme = "loose"

[tool.polylith.resources]
    brick_docs_enabled = false

[tool.polylith.test]
    enabled = false

[tool.poetry.dependencies]
    aiohttp                  = "^3.10.3"
    azure-mgmt-authorization = "^4.0.0"
    azure-mgmt-network       = "^28.0"
    cryptography             = "^43.0.0"
    jinja2                   = "^3.1.4"
    pulumi                   = "^3.142"
    pulumi-azure-native      = "^2.71"
    pulumi-azuread           = "^6.0.1"
    pulumi-cloudinit         = "^1.4.7"
    pulumi-command           = "^1.0.1"
    pulumi-postgresql        = "^3.12.0"
    pulumi-random            = "^4.16"
    pulumi-std               = "^1.7.3"
    pulumi-tls               = "^5.0.1"
    pulumiverse-acme         = "^0.6"
    pulumiverse-time         = "^0.1"
    pydantic                 = { extras = ["email"], version = "^2.10" }
    pydantic-settings        = "^2.4"
    python                   = "^3.12"

[tool.poetry.group.dev.dependencies]
    commitizen   = "^3.27"
    copier       = "^9.1.1"
    debugpy      = "^1.8.6"
    ipykernel    = "^6.29.3"
    pre-commit   = "^4.0"
    pyright      = "^1.1"
    pytest       = "^8.0.2"
    pytest-cov   = "^6.0.0"
    pytest-sugar = "^1.0.0"
    ruff         = "^0.7"

[tool.pyright]
    include = ["bases", "components", "development", "test"]
    # ignore = ["development"]
    extraPaths             = ["bases", "components"]
    reportMissingTypeStubs = true
    ruff                   = "^0.2.1"
    typeCheckingMode       = "basic"
    useLibraryCodeForTypes = true
    venv                   = ".venv"
    venvPath               = "."

[tool.pytest.ini_options]
    addopts = ["-s", "-vvv"]
    filterwarnings = [
        "ignore::DeprecationWarning:commitizen.*",
        "ignore::DeprecationWarning:importlib._bootstrap.*",
        "ignore::DeprecationWarning:pulumi.*",
        "ignore::DeprecationWarning:pulumi_azure_native.*:",
    ]
    norecursedirs = [".*", ".venv", "venv"]
    python_files = ["test.py", "test_*.py", "tests.py"]
    testpaths = [
        "test/bases/orbitcloud_graviton",
        "test/components/orbitcloud_graviton",
    ]

[tool.coverage.run]
    branch   = true
    parallel = true
    source   = ["bases/orbitcloud_graviton", "components/orbitcloud_graviton"]

[tool.coverage.report]
    ignore_errors              = true
    include_namespace_packages = true
    omit                       = ["**/__init__.py", "**/venv/*", ".venv/*", "development/*", "test/*"]
    skip_empty                 = true

[tool.ruff]
    # target-version = "py310"
    extend-exclude = [
        # "development/*",
        "tests/*",
    ]
    line-length = 100
    lint.ignore = [
        "B008", # do not perform function calls in argument defaults
        "E501", # line too long, handled by black
        # "C901", # too complex
        "B904", # Allow raising exceptions without from e, for HTTPException
        "W191", # indentation contains tabs
    ]
    lint.select = [
        "ARG001", # unused arguments in functions
        "B",      # flake8-bugbear
        "C4",     # flake8-comprehensions
        "E",      # pycodestyle errors
        "F",      # pyflakes
        "I",      # isort
        "UP",     # pyupgrade
        "W",      # pycodestyle warnings
    ]

    [tool.ruff.lint.pyupgrade]
        # Preserve types, even if a file imports `from __future__ import annotations`.
        keep-runtime-typing = true

    [tool.ruff.lint.isort]
        known-first-party = ["orbitcloud_graviton"]
        known-third-party = [
            "pulumi",
            "pulumi_azure_native",
            "pulumi_azuread",
            "pydantic",
        ]

[tool.commitizen]
    bump_message             = "bump: $current_version → $new_version"
    changelog_incremental    = true
    major_version_zero       = true                                    # Remove when we hit 1.0.0
    name                     = "cz_conventional_commits"
    tag_format               = "v$version"
    update_changelog_on_bump = true
    version                  = "0.73.0"
    version_files            = ["VERSION", "pyproject.toml:^version"]

[build-system]
    build-backend = "poetry.core.masonry.api"
    requires      = ["poetry-core"]
