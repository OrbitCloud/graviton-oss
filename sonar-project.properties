# SonarCloud configuration for Graviton CDK

# Exclude test files from IP address detection
# Test files use hardcoded IP addresses (e.g., 10.0.0.0/24) as test data for
# validating Azure network configurations. These are RFC 1918 private addresses
# and are safe to use in test contexts.
sonar.issue.ignore.multicriteria=e1

# Ignore IP address detection in test files
e1.ruleKey=python:S1313
e1.resourceKey=test/**/*

# Additional configuration to exclude test files from duplicate code detection
# as test data often contains similar patterns
sonar.cpd.exclusions=test/**/*
