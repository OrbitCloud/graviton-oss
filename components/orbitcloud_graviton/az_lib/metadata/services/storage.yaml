      prefix: stq
    namespace: Microsoft.Storage/storageAccounts/queueServices
    resource_type: storageAccounts/queueServices/queues
    sub_resource_name: queue
    private_dns_zone: privatelink.queue.core.windows.net
  BlobContainer:
