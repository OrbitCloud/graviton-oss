[project]
name = "orbitcloud-graviton"
version = "0.89.0"
description = "Python Infrastructure-as-Code development kit for Azure, built on Pulumi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0"
authors = [{ name = "Orbit Team", email = "admin@orbit.is" }]
dependencies = [
    "aiohttp>=3.11,<4",
    "azure-mgmt-authorization>=4,<5",
    "azure-mgmt-network>=30,<31",
    "cryptography>=46,<47",
    "jinja2>=3.1.4,<4",
    "pulumi>=3.138,<4",
    "pulumi-azure-native>=3.7,<4",
    "pulumi-azuread>=6.0.1,<7",
    "pulumi-cloudinit>=1.4.7,<2",
    "pulumi-command>=1.0.1,<2",
    "pulumi-postgresql>=3.12,<4",
    "pulumi-random>=4.16,<5",
    "pulumi-std>=2.1,<3",
    "pulumi-tls>=5.0.1,<6",
    "pulumiverse-acme>=0.14,<0.15",
    "pulumiverse-time>=0.1,<0.2",
    "pydantic[email]>=2.10,<3",
    "pydantic-settings>=2.4,<3",
]

[dependency-groups]
dev = [
    "commitizen>=4,<5",
    "copier>=9.1.1,<10",
    "debugpy>=1.8.6,<2",
    "ipykernel>=7.1,<8",
    "pre-commit>=4,<5",
    "pyright>=1.1,<2",
    "pytest>=9.0.1,<10",
    "pytest-cov>=7,<8",
    "pytest-sugar>=1,<2",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "bases/orbitcloud_graviton",
    "components/orbitcloud_graviton",
]

[tool.polylith]
namespace = "orbitcloud_graviton"

[tool.polylith.tag.patterns]
release = "v[0-9]*"
stable = "stable-*"

[tool.polylith.structure]
theme = "loose"

[tool.polylith.resources]
brick_docs_enabled = false

[tool.polylith.test]
enabled = false

[tool.pyright]
include = ["bases", "components", "test"]
# ignore = ["development"]
extraPaths = ["bases", "components"]
reportMissingTypeStubs = true
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = ["-s", "-vvv"]
filterwarnings = [
    "ignore::DeprecationWarning:commitizen.*",
    "ignore::DeprecationWarning:importlib._bootstrap.*",
    "ignore::DeprecationWarning:pulumi.*",
    "ignore::DeprecationWarning:pulumi_azure_native.*:",
]
norecursedirs = [".*", ".venv", "venv"]
python_files = ["test.py", "test_*.py", "tests.py"]
testpaths = [
    "test/bases/orbitcloud_graviton",
    "test/components/orbitcloud_graviton",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["bases/orbitcloud_graviton", "components/orbitcloud_graviton"]

[tool.coverage.report]
ignore_errors = true
include_namespace_packages = true
omit = [
    "**/__init__.py",
    "**/venv/*",
    ".venv/*",
    "development/*",
    "sdk/*",
    "test/*",
]
skip_empty = true

[tool.ruff]
extend-exclude = [
    # "development/*",
    "sdk/*",
    "tests/*",
]
line-length = 100
lint.ignore = [
    "B008", # do not perform function calls in argument defaults
    "E501", # line too long, handled by black
    # "C901", # too complex
    "B904", # Allow raising exceptions without from e, for HTTPException
    "W191", # indentation contains tabs
]
lint.select = [
    "ARG001", # unused arguments in functions
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
target-version = "py311"

# [tool.ruff.lint.pyupgrade]
#     # Preserve types, even if a file imports `from __future__ import annotations`.
#     keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["orbitcloud_graviton"]
known-third-party = [
    "pulumi",
    "pulumi_azure_native",
    "pulumi_azuread",
    "pydantic",
]

[tool.commitizen]
bump_message = "bump: $current_version → $new_version"
changelog_incremental = true
major_version_zero = true                              # Remove when we hit 1.0.0
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "pep621"
version_files = ["VERSION"]
