[tool.poetry]
name = "orbitcloud-graviton"
version = "0.2.0"
description = ""
authors = ["Orbit Team <admin@orbit.is>"]
license = "MIT"
readme = "README.md"
packages = [
    # Lib and helpers
    { include = "orbitcloud_graviton/pulumi_mocks", from = "components" },
    { include = "orbitcloud_graviton/az_lib", from = "components" },

    # Azure Components
    { include = "orbitcloud_graviton/az_monitor", from = "components" },
    { include = "orbitcloud_graviton/az_resources", from = "components" },

    # Bases
    { include = "orbitcloud_graviton/loganalytics", from = "bases" },
]

[tool.poetry.dependencies]
python = "^3.11"
pulumi = "^3.79.0"
pulumi-azure-native = "^2.4.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pyright = "^1.1.324"
isort = "^5.12.0"
black = "^23.7.0"
dunamai = "^1.18.0"
commitizen = "^3.7.0"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
tag_format = "v$version"
version_files = [
    "VERSION",
    "pyproject.toml:^version",
    ]
update_changelog_on_bump = true
changelog_incremental = true
bump_message = "bump: $current_version → $new_version"
major_version_zero = true # Remove when we hit 1.0.0

[tool.pyright]
reportMissingTypeArgument = true  # Report generic classes used without type arguments
strictListInference = true  # Use union types when inferring types of lists elements, instead of Any

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
