name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - run: make lint
      - run: make test

      - name: Smoke test (build wheel and verify imports)
        run: |
          rm -rf dist/
          uv build
          uv run --isolated --with dist/orbitcloud_graviton-*.whl python -c "
          from orbitcloud_graviton.az_storage import StorageAccount
          from orbitcloud_graviton.az_network import Vnet
          from orbitcloud_graviton.az_keyvault import KeyVault
          from orbitcloud_graviton.az_postgres import PostgresFlexibleServer
          print('All imports OK')
          "

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@v1.1.59
        if: github.event_name == 'pull_request'
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: test
    name: Release
    environment: release
    steps:
      - uses: actions/create-github-app-token@v2.2.1
        id: bot-token
        with:
          app-id: ${{ vars.GRAVITON_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GRAVITON_BOT_PRIVATE_KEY }}
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}
      - id: commitizen
        name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ steps.bot-token.outputs.token }}
          changelog_increment_filename: body.md
          push: true
          git_name: graviton-bot[bot]
          git_email: 823040+graviton-bot[bot]@users.noreply.github.com
      - id: check-tag
        name: Check if tag exists
        run: |
          RELEASE=$(gh release view "$RELEASE_TAG" --json id,name,tagName || true)
          if [ -z "$RELEASE" ]; then
            echo "IS_NEW_TAG=true" >> $GITHUB_OUTPUT
            exit 0
          fi
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          RELEASE_TAG: ${{ steps.commitizen.outputs.version }}
      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.check-tag.outputs.IS_NEW_TAG == 'true' }}
        with:
          body_path: "body.md"
          tag_name: ${{ steps.commitizen.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
