# SonarCloud configuration for Graviton CDK
#
# This configuration file tells SonarCloud how to analyze the codebase and
# which rules to suppress in specific contexts.

# ============================================================================
# IP Address Detection (Rule S1313)
# ============================================================================
# Exclude test files from IP address detection warnings.
#
# Context: Test files throughout this repository use hardcoded IP addresses
# (e.g., 10.0.0.0/24, 192.168.1.0/24) as test data for validating Azure
# network configurations such as:
#   - Virtual Network (VNet) CIDR ranges
#   - Firewall rules and network policies
#   - Subnet configurations
#   - Private/public IP address validation
#
# These are RFC 1918 private addresses and are safe to use in test contexts.
# They are not production configuration values or secrets.
#
# Examples of affected test files:
#   - test/components/orbitcloud_graviton/az_network/test_firewall_config.py
#   - test/components/orbitcloud_graviton/az_network/test_network_types.py
#   - test/components/orbitcloud_graviton/az_network/test_vnet_config.py
#
sonar.issue.ignore.multicriteria=e1,e2

# Suppress rule S1313 (IP address detection) for all test files
e1.ruleKey=python:S1313
e1.resourceKey=test/**/*

# Suppress rule S5hard-coded credentials) for test files
# Test snapshot data references Pulumi SDK module paths like
# "pulumi_random.random_password" which triggers false positives.
e2.ruleKey=python:S105
e2.resourceKey=test/**/*

# ============================================================================
# Code Duplication Detection
# ============================================================================
# Exclude test files from code duplication detection.
#
# Test data often contains similar patterns and structures, which is expected
# and intentional for comprehensive test coverage.
#
sonar.cpd.exclusions=test/**/*
