#cloud-config
# yaml-language-server: $schema=https://raw.githubusercontent.com/canonical/cloud-init/main/cloudinit/config/schemas/versions.schema.cloud-config.json

yum_repos:
  microsoft-prod:
    name: microsoft-prod
    baseurl: https://packages.microsoft.com/rhel/9.0/prod
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc

  azure_vm_tools:
    baseurl: https://download.copr.fedorainfracloud.org/results/cjp256/azure-vm-utils/epel-9-x86_64/
    enabled: true
    gpgcheck: true
    gpgkey: https://download.copr.fedorainfracloud.org/results/cjp256/azure-vm-utils/pubkey.gpg

packages:
  - azure-cli
  - azure-vm-utils
