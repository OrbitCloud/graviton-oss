name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: 'pyproject.toml'

      # Cache the installation of Poetry itself, e.g. the next step. This prevents the workflow
      # from installing Poetry every time, which can be slow. Note the use of the Poetry version
      # number in the cache key, and the "-0" suffix: this allows you to invalidate the cache
      # manually if/when you want to upgrade Poetry, or if something goes wrong. This could be
      # mildly cleaner by using an environment variable, but I don't really care.
      - name: cache poetry install
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: poetry-1.8.5-0

      # The key configuration value here is `virtualenvs-in-project: true`: this creates the
      # venv as a `.venv` in your testing directory, which allows the next step to easily
      # cache it.
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: cache deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: .venv
          key: pydeps-${{ hashFiles('**/poetry.lock') }}

      # Install dependencies. `--no-root` means "install all dependencies but not the project
      # itself", which is what you want to avoid caching _your_ code. The `if` statement
      # ensures this only runs on a cache miss.
      - run: poetry install --no-interaction --no-root
        if: steps.cache-deps.outputs.cache-hit != 'true'

      # Now install _your_ project. This isn't necessary for many types of projects -- particularly
      # things like Django apps don't need this. But it's a good idea since it fully-exercises the
      # pyproject.toml and makes that if you add things like console-scripts at some point that
      # they'll be installed and working.
      - run: poetry install --no-interaction

      - run: poetry run make lint
      - run: poetry run make test

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@v1.7.2
        if: github.event_name == 'pull_request'
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: test
    name: Release
    environment: release
    steps:
      - uses: actions/create-github-app-token@v2.2.1
        id: bot-token
        with:
          app-id: ${{ vars.GRAVITON_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GRAVITON_BOT_PRIVATE_KEY }}
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}
      - id: commitizen
        name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ steps.bot-token.outputs.token }}
          changelog_increment_filename: body.md
          push: true
          git_name: graviton-bot[bot]
          git_email: 823040+graviton-bot[bot]@users.noreply.github.com
      - id: check-tag
        name: Check if tag exists
        run: |
          RELEASE=$(gh release view "$RELEASE_TAG" --json id,name,tagName || true)
          if [ -z "$RELEASE" ]; then
            echo "IS_NEW_TAG=true" >> $GITHUB_OUTPUT
            exit 0
          fi
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          RELEASE_TAG: ${{ steps.commitizen.outputs.version }}
      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.check-tag.outputs.IS_NEW_TAG == 'true' }}
        with:
          body_path: "body.md"
          tag_name: ${{ steps.commitizen.outputs.version }}
          token: ${{ steps.bot-token.outputs.token }}
